<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Static Website</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; }
    main { max-width: 680px; margin: 24px; padding: 40px; background: white; border-radius: 18px; box-shadow: 0 12px 40px #17203318; }
    h1 { margin-top: 0; } code { background: #edf2f7; padding: 3px 7px; border-radius: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>Deployed with DevOps 🚀</h1>
    <p>This static site is packaged with Docker, published to Docker Hub by GitHub Actions, and hosted on AWS EC2.</p>
    <p>Infrastructure: <code>Terraform</code> · Configuration: <code>Ansible</code> · Monitoring: <code>Prometheus + Grafana</code></p>
  </main>
</body>
</html>
