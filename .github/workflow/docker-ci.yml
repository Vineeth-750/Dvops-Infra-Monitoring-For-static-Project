name: Static site CI and Docker Hub publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -s website/index.html
          grep -qi '<html' website/index.html
          grep -qi '</html>' website/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (all workflow events)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: static-site:test

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/static-site:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/static-site:${{ github.sha }}
